name: Atualizar ofertas
on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_offers.py
      - name: Publicar só se houver novidades
        run: |
          git config user.name "milhas-radar"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- docs/data.json)" ]; then
            git add docs
            git commit -m "Atualiza ofertas" && git push
          else
            echo "Sem novidades."
          fi
