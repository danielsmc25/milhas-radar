name: Atualizar ofertas
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_offers.py
      - name: Publicar mudanças
        run: |
          git config user.name "milhas-radar"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Atualiza ofertas" && git push)
